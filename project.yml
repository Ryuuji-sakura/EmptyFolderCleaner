name: EmptyFolderCleaner
options:
  bundleIdPrefix: com.ryuujisakura
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  EmptyFolderCleaner:
    type: application
    platform: macOS
    sources:
      - path: EmptyFolderCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner
        DEVELOPMENT_TEAM: Y9B2784T8A
        PRODUCT_NAME: EmptyFolderCleaner
        PRODUCT_MODULE_NAME: EmptyFolderCleaner
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
      configs:
        Release:
          # これを外さないと com.apple.security.get-task-allow（デバッガ接続を許す
          # entitlement）が署名に混入し、公証が Invalid で弾かれる。
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        CFBundleDisplayName: 空フォルダ削除
        # これが無いと Info.plist にはxcodegenの既定値 1.0 が焼き込まれ、
        # MARKETING_VERSION を上げても配布物のバージョンが変わらない。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeRole: Viewer
            CFBundleTypeName: Folder
            LSItemContentTypes:
              - public.folder
            LSHandlerRank: Alternate
    entitlements:
      path: EmptyFolderCleaner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
  EmptyFolderCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Compiled straight into the test bundle so the logic can be exercised
      # without launching the sandboxed GUI app as a test host.
      - path: EmptyFolderCleaner/FolderSweeper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner.tests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  EmptyFolderCleanerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: EmptyFolderCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner.uitests
        TEST_TARGET_NAME: EmptyFolderCleaner
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y9B2784T8A
schemes:
  EmptyFolderCleaner:
    build:
      targets:
        EmptyFolderCleaner: all
        EmptyFolderCleanerTests: [test]
        EmptyFolderCleanerUITests: [test]
    test:
      config: Debug
      targets:
        - EmptyFolderCleanerTests
        - EmptyFolderCleanerUITests
    run:
      config: Debug
