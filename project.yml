name: EmptyFolderCleaner
options:
  bundleIdPrefix: com.ryuujisakura
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # UIが全編日本語なので、バンドルもそう名乗る。`en` のままだと英語環境のMacで
  # 「英語のアプリのはずが日本語」という扱いになり、App Storeのローカライズ設定とも食い違う。
  developmentLanguage: ja
# Release は Developer ID 配布（公証あり）、ReleaseMAS は Mac App Store 提出用。
# 署名まわりの要求が正反対なので、同じ設定では両立しない。
configs:
  Debug: debug
  Release: release
  ReleaseMAS: release
targets:
  EmptyFolderCleaner:
    type: application
    platform: macOS
    sources:
      - path: EmptyFolderCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner
        DEVELOPMENT_TEAM: Y9B2784T8A
        PRODUCT_NAME: EmptyFolderCleaner
        PRODUCT_MODULE_NAME: EmptyFolderCleaner
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
      configs:
        Release:
          # Developer ID 配布用。これを外さないと
          # com.apple.security.get-task-allow（デバッガ接続を許す entitlement）が
          # 署名に混入し、公証が Invalid で弾かれる。
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ReleaseMAS:
          # Mac App Store 提出用。こちらは逆に YES が要る。NO にすると
          # プロビジョニングプロファイル由来の com.apple.application-identifier まで
          # 落ちてしまい、App Store Connect が Invalid Code Signing Entitlements で弾く。
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
          CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        # サポートサイト（ryuuji-sakura.github.io）の表記に合わせて屋号で統一。
        # LICENSE の MIT 著作権者は法的な記載なので Ryuuji Hara のまま。
        NSHumanReadableCopyright: © 2026 半歩舎
        CFBundleDisplayName: 空フォルダ削除
        # 暗号化を使っていないことを宣言しておくと、提出のたびに
        # App Store Connect の輸出コンプライアンス質問に答えずに済む。
        ITSAppUsesNonExemptEncryption: false
        # これが無いと Info.plist にはxcodegenの既定値 1.0 が焼き込まれ、
        # MARKETING_VERSION を上げても配布物のバージョンが変わらない。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeRole: Viewer
            CFBundleTypeName: Folder
            LSItemContentTypes:
              - public.folder
            LSHandlerRank: Alternate
    entitlements:
      path: EmptyFolderCleaner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
  EmptyFolderCleanerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Compiled straight into the test bundle so the logic can be exercised
      # without launching the sandboxed GUI app as a test host.
      - path: EmptyFolderCleaner/FolderSweeper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner.tests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  EmptyFolderCleanerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: EmptyFolderCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuujisakura.emptyfoldercleaner.uitests
        TEST_TARGET_NAME: EmptyFolderCleaner
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y9B2784T8A
schemes:
  EmptyFolderCleaner:
    build:
      targets:
        EmptyFolderCleaner: all
        EmptyFolderCleanerTests: [test]
        EmptyFolderCleanerUITests: [test]
    test:
      config: Debug
      targets:
        - EmptyFolderCleanerTests
        - EmptyFolderCleanerUITests
    run:
      config: Debug
